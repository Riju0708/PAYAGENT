<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PayAgent</title>
<style>
:root{--bg:#f7f6f2;--tx:#1d2433;--mut:#6a7080;--ln:#dcdad2;--ac:#1f4fd8;--ok:#1e7b4f;--wn:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#14171f;--tx:#eceae3;--mut:#9a9fae;--ln:#2b303d;--ac:#7ea0ff;--ok:#5fcf9a;--wn:#e0aa4e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,'Times New Roman',serif}
main{max-width:820px;margin:0 auto;padding:40px 18px 80px}
h1{font-size:2rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 28px}
textarea{width:100%;font:inherit;font-size:1.25rem;padding:14px 0;border:0;border-bottom:2px solid var(--tx);background:transparent;color:inherit;resize:none;outline:none}
textarea:focus-visible{border-color:var(--ac)}
button,.btn{font:inherit;font-size:.95rem;cursor:pointer;border:1px solid var(--tx);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:2px}
button.ghost{background:transparent;color:var(--tx)}
button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
#out{color:var(--mut);min-height:1.5em}
a{color:var(--ac)}
.stats{display:flex;gap:36px;margin:36px 0 8px;padding:16px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.stats b{display:block;font-size:1.7rem}.stats span{color:var(--mut);font-size:.9rem}
.table{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{font-weight:normal;color:var(--mut)}
.PAID{color:var(--ok)}.PENDING{color:var(--wn)}
pre{white-space:pre-wrap;font:inherit;background:transparent;border-left:3px solid var(--ac);padding:4px 14px;margin:14px 0}
</style></head><body><main>
<h1>PayAgent</h1>
<p class="sub">Say who owes you what. The agent builds the PayPal invoice and tracks the payment.</p>
<textarea id="msg" rows="2" placeholder="Bill Ravi $20 for logo design"></textarea>
<div class="row"><button onclick="send()">Create invoice</button><span id="out"></span></div>
<div class="stats" id="stats"></div>
<div class="table"><table><thead><tr><th>Client</th><th>For</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="row"><button class="ghost" onclick="insights()">What should I do next?</button><button class="ghost" onclick="load()">Refresh</button></div>
<pre id="ins" hidden></pre>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(u,o)=>(await fetch(u,o)).json();
const show=t=>{$('#ins').hidden=false;$('#ins').textContent=t};
async function load(){
  const d=await api('/api/invoices');
  const tot=d.reduce((a,i)=>a+i.amount,0), paid=d.filter(i=>i.status=='PAID').reduce((a,i)=>a+i.amount,0);
  $('#stats').innerHTML=[['Billed',tot],['Collected',paid],['Still owed',tot-paid]].map(([l,v])=>`<div><b>$${v.toFixed(2)}</b><span>${l}</span></div>`).join('');
  $('#rows').innerHTML=d.map(i=>`<tr><td>${esc(i.client)}</td><td>${esc(i.description)}</td><td>$${i.amount.toFixed(2)}</td><td class="${i.status}">${i.status=='PAID'?'Paid':'Waiting'}</td><td>${i.status=='PAID'?'':`<a href="${esc(i.link)}" target="_blank" rel="noopener">Pay link</a> &nbsp; <a href="#" onclick="remind(${i.id});return false">Draft reminder</a>`}</td></tr>`).join('')||'<tr><td colspan="5">No invoices yet. Type one above.</td></tr>';
}
async function send(){
  const m=$('#msg').value.trim(); if(!m)return;
  $('#out').textContent='Working on it...';
  const d=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
  $('#out').innerHTML=d.error?esc(d.error):`Invoice ready for ${esc(d.client)}. <a href="${esc(d.link)}" target="_blank" rel="noopener">Open PayPal link</a>`;
  if(!d.error)$('#msg').value=''; load();
}
async function insights(){show('Looking at your invoices...');const d=await api('/api/insights');show(d.text||d.error)}
async function remind(id){show('Writing...');const d=await api('/api/reminder/'+id,{method:'POST'});show(d.text||d.error)}
$('#msg').addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();send()}});
load();
</script></main></body></html>
